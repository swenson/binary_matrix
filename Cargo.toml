[package]
name = "binary_matrix"
version = "0.1.4"
edition = "2021"
authors = ["Christopher Swenson <swenson@swenson.io>"]
description = "Dense binary matrix operations."
repository = "https://github.com/swenson/binary_matrix"
license = "MIT"
keywords = ["math", "matrix", "binary"]
categories = ["mathematics"]
rust-version = "1.63"
exclude = [".github"]

[features]
default = []
rand = ["dep:rand"]
# Requires nightly (std::simd).
simd = []
# Enables the #[bench] benchmarks. Requires nightly.
bench = []

[dependencies]
rand = { version = "0.8.5", optional = true }

[dev-dependencies]
paste = "1.0.14"
rand = "0.8.5"
rand_chacha = "0.3.1"
